# Render Blueprint for the Karvia API (free plan, development / staging).
# Render → New → Blueprint → pick this repo. Values marked sync:false are asked for during setup.
services:
  - type: web
    name: karvia-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --workspace backend --include-workspace-root --include=dev && npm run build -w backend && npm run prisma:deploy -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production
      # Staging only: test OTPs shown on screen and simulated payments. Remove before real users.
      - key: ALLOW_DEV_PROVIDERS
        value: "true"
      - key: OTP_DEV_ECHO
        value: "true"
      - key: SMS_PROVIDER
        value: console
      - key: PAYMENT_PROVIDER
        value: mock
      # Browser → Vercel → Render: two proxies in front of the API.
      - key: TRUST_PROXY
        value: "2"
      - key: OTP_PER_IP_PER_HOUR
        value: "30"
      - key: STORAGE_DIR
        value: ./storage
      # Database (Neon). Use the DIRECT (non-pooler) connection string for both.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Comma-separated Vercel URLs, e.g. https://karvia-web.vercel.app,https://karvia-admin.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Secrets generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: FILE_URL_SECRET
        generateValue: true
      # 32 random bytes, base64. Generate with:
      # node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: DATA_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
